<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра: Успей Слить!</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: #fff; padding-top: 50px; }
        .game-box { border: 2px solid #00ffcc; display: inline-block; padding: 30px; border-radius: 10px; background: #2a2a2a; }
        button { background: #00ffcc; border: none; padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 5px; margin: 10px; font-weight: bold; }
        button:hover { background: #00ccaa; }
        .danger { background: #ff4444; color: white; }
        .danger:hover { background: #cc3333; }
    </style>
</head>
<body>

<div class="game-box">
    <h1>Игра: Вовремя Слей</h1>
    <p>Накопленные очки (риск растет): <span id="current-points" style="font-size: 24px; color: #00ffcc;">0</span></p>
    <p>Твой общий банк: <span id="bank" style="font-size: 24px; color: #ffcc00;">0</span></p>
    
    <button id="btn-accumulate">Накопить очки</button>
    <button id="btn-cashout" class="danger">СЛИТЬ В БАНК</button>
    
    <p id="status-message" style="margin-top: 20px; font-style: italic;"></p>
</div>

<script>
    let points = 0;
    let bank = 0;
    let crashChance = 0.05; // Шанс сгорания очков при каждом шаге (5%)

    const pointsEl = document.getElementById('current-points');
    const bankEl = document.getElementById('bank');
    const statusEl = document.getElementById('status-message');

    // Кнопка: Накопить очки
    document.getElementById('btn-accumulate').addEventListener('click', () => {
        statusEl.innerText = "";
        
        // Проверяем случайный сбой (слив)
        if (Math.random() < crashChance) {
            statusEl.innerHTML = "<span style='color: red;'>Ой! Очки сгорели до того, как ты их слил в банк!</span>";
            points = 0;
            crashChance = 0.05; // Сброс риска
        } else {
            points += Math.floor(Math.random() * 10) + 5;
            crashChance += 0.03; // С каждым шагом риск растет
            statusEl.innerText = "Очки растут! Риск обнуления увеличился.";
        }
        pointsEl.innerText = points;
    });

    // Кнопка: Слить в банк (зафиксировать)
    document.getElementById('btn-cashout').addEventListener('click', () => {
        if (points > 0) {
            bank += points;
            statusEl.innerHTML = `<span style='color: green;'>Успешно! Ты слил ${points} очков в банк.</span>`;
            points = 0;
            crashChance = 0.05; // Сброс риска
            pointsEl.innerText = points;
            bankEl.innerText = bank;
        } else {
            statusEl.innerText = "Нечего сливать, сначала накопи очки!";
        }
    });
</script>

</body>
</html>
